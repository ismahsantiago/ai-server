services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:{GENERATION_FINGERPRINT}
    container_name: ai-lab-llama-server-chat
    restart: "no"
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    command:
      - --model
      - "/models/model.gguf"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --ctx-size
      - "4096"
      - --threads
      - "6"
      - --batch-size
      - "256"
      - --n-predict
      - "256"
      - --metrics
      - --cont-batching
    volumes:
      - type: bind
        source: "{PROJECT_ROOT}/models/ornith-9b.gguf"
        target: /models/model.gguf
        read_only: true
    mem_limit: 8g
    cpus: 6.0
    pids_limit: 256
    user: "65532:65532"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m
